name: psc_tips_tricks_mobile
description: "PSC Tips & Tricks — Student app for Kerala PSC exam preparation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1

  # Media & documents
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  youtube_player_flutter: ^9.1.1
  flutter_pdfview: ^1.3.2

  # Auth / payments / realtime
  webview_flutter: ^4.9.0
  razorpay_flutter: ^1.3.7
  socket_io_client: ^2.0.3+1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  crypto: ^3.0.3
  # AES-CTR for the offline vault: a stream cipher, so a download can be
  # encrypted as it arrives and resumed mid-file at the right counter offset.
  pointycastle: ^3.9.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
