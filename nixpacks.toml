# Adds system binaries needed for the book-reader audio pipeline (AI noise
# removal via ffmpeg's arnndn filter, transcription via whisper.cpp) on top
# of Railway's existing auto-detected Nixpacks Node build for apps/api.
#
# Only the setup phase is touched — nixPkgs additions and one extra cmd —
# so the previously-working auto-detected build/start commands (and any
# Start Command override set in the Railway dashboard) are unaffected.
#
# This assumed the Railway api service's "Root Directory" is the monorepo
# root — confirmed WRONG on 2026-08-17 (production logs showed `spawn ffmpeg
# ENOENT`, meaning this file was never picked up). An identical config now
# also lives at apps/api/nixpacks.toml (scoped for Root Directory = apps/api)
# as a hedge. Once it's confirmed which one Railway actually reads, delete
# the other to avoid confusion.
[phases.setup]
nixPkgs = ["ffmpeg", "whisper-cpp"]
cmds = ["bash apps/api/scripts/setup-audio-models.sh"]
