# Same as the root nixpacks.toml, scoped for the case where the Railway api
# service's "Root Directory" is apps/api rather than the monorepo root — if
# that's the case, Railway/Nixpacks only ever looks for a nixpacks.toml here,
# never at the repo root, so the root copy would be silently ignored.
#
# Paths below are relative to apps/api itself (no `apps/api/` prefix, unlike
# the root copy) since that's the build context in this scenario.
[phases.setup]
nixPkgs = ["ffmpeg", "whisper-cpp"]
cmds = ["bash scripts/setup-audio-models.sh"]
