<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEA79" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <g transform="translate(0, 15)">
    <path d="M 128 350 Q 192 330 256 360 L 256 400 Q 192 370 128 390 Z" fill="url(#pageLeft)" opacity="0.95" />
    <path d="M 256 360 Q 320 330 384 350 L 384 390 Q 320 370 256 400 Z" fill="url(#pageRight)" opacity="0.95" />
  </g>

  <path d="M 288 88 L 168 264 H 256 L 224 424 L 344 248 H 256 Z" fill="url(#boltGrad)" filter="url(#boltGlow)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
</svg>
