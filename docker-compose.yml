version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psc_postgres
    restart: always
    environment:
      POSTGRES_USER: psc_user
      POSTGRES_PASSWORD: psc_password
      POSTGRES_DB: psc_tips_tricks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc_user -d psc_tips_tricks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
